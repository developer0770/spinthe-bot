version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: spinthe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spinthe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spinthe_secret}
      POSTGRES_DB: ${POSTGRES_DB:-spinthe}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spinthe} -d ${POSTGRES_DB:-spinthe}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: spinthe-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: spinthe-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-spinthe}:${POSTGRES_PASSWORD:-spinthe_secret}@postgres:5432/${POSTGRES_DB:-spinthe}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please}
      BOT_TOKEN: ${BOT_TOKEN}
      CORS_ORIGIN: "*"
      PORT: 3000
    ports:
      - "${SERVER_PORT:-3000}:3000"

  webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    container_name: spinthe-webapp
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
  redisdata:
